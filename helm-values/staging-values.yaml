# 스테이징 환경 Helm values
# base-values.yaml을 상속하며, 운영과 동일한 기능을 활성화하여 사전 검증합니다.

cluster_config:
  name: "staging-cluster"
  tags:
    environment: staging

features:
  # AC: 실제 적용 모드이나 실패 시 통과 (Ignore)
  admission_control:
    enabled: true
    failure_policy: Ignore
    dry_run: false

  # 모든 보안 기능 활성화 (운영과 동일하게 테스트)
  detections:
    drift_control:
      enabled: true
    malware_control:
      enabled: true
    ml_policies:
      enabled: true
    kubernetes_audit:
      enabled: true
    file_integrity_monitoring:
      enabled: true

  investigations:
    activity_audit:
      enabled: true
    live_logs:
      enabled: true
    captures:
      enabled: true
    network_security:
      enabled: true

  respond:
    rapid_response:
      enabled: true
    response_actions:
      enabled: true

cluster:
  replica_count: 2
  additional_settings:
    log_level: info
