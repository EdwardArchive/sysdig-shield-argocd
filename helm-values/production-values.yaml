# 운영 환경 Helm values
# base-values.yaml을 상속하며, 최대 보안 및 고가용성 설정을 적용합니다.

cluster_config:
  name: "production-cluster"
  tags:
    environment: production

features:
  # AC: 정책 위반 시 차단 (Fail)
  admission_control:
    enabled: true
    failure_policy: Fail
    dry_run: false
    container_vulnerability_management:
      enabled: true
    posture:
      enabled: true
    supply_chain:
      enabled: true
      image_signature:
        enabled: false

  # 모든 보안 기능 활성화
  detections:
    drift_control:
      enabled: true
    malware_control:
      enabled: true
    ml_policies:
      enabled: true
    kubernetes_audit:
      enabled: true
    file_integrity_monitoring:
      enabled: true

  investigations:
    activity_audit:
      enabled: true
    live_logs:
      enabled: true
    captures:
      enabled: true
    network_security:
      enabled: true

  respond:
    rapid_response:
      enabled: true
    response_actions:
      enabled: true

# 운영 환경 리소스 확대
host:
  resources:
    shield:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1500m"
    kmodule:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1500m"

# 고가용성 설정
cluster:
  replica_count: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  pod_disruption_budget:
    create: true
    min_available: 1
  additional_settings:
    log_level: warning
