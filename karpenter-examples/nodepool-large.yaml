# ============================================================
# Karpenter NodePool 예시: Large 인스턴스 그룹
# ============================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: large-nodes
spec:
  template:
    metadata:
      labels:
        node-size-class: large
    spec:
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64", "arm64"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["m", "c", "r", "i"]
      - key: karpenter.k8s.aws/instance-size
        operator: In
        values: ["4xlarge", "8xlarge", "12xlarge", "16xlarge", "24xlarge"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "10000"
    memory: 20000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
