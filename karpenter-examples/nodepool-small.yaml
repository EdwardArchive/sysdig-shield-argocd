# ============================================================
# Karpenter NodePool 예시: Small 인스턴스 그룹
# 이 파일은 참고용 예시이며, 실제 Karpenter NodePool은 고객 환경에서 관리
# ============================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: small-nodes
spec:
  template:
    metadata:
      labels:
        # Shield DaemonSet nodeSelector 대상
        node-size-class: small
    spec:
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64", "arm64"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["t", "m"]
      - key: karpenter.k8s.aws/instance-size
        operator: In
        values: ["medium", "large", "xlarge"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand", "spot"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "1000"
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
