# ============================================================
# ApplicationSet: Cluster Generator + 멀티 노드그룹
# ============================================================
# ArgoCD에 등록된 클러스터를 자동 감지하여 배포하는 방식
# 새 클러스터가 ArgoCD에 등록되면 자동으로 Shield가 배포됨
#
# 사전 조건:
#   - ArgoCD에 클러스터가 Secret으로 등록되어 있어야 함
#   - 클러스터 Secret에 라벨이 설정되어 있어야 함:
#       sysdig-enabled: "true"
#       environment: "production" | "staging" | "dev"
#       cluster-name: "<클러스터명>"
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sysdig-shield-cluster-multi
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      # Generator 1: ArgoCD에 등록된 클러스터 자동 감지
      - clusters:
          selector:
            matchLabels:
              sysdig-enabled: "true"
      # Generator 2: 노드그룹 정의
      - list:
          elements:
          - nodegroup: small
            profile: small
          - nodegroup: medium
            profile: medium
          - nodegroup: large
            profile: large

  strategy:
    type: RollingSync
    rollingSync:
      steps:
      - matchExpressions:
        - key: environment
          operator: In
          values: [dev]
      - matchExpressions:
        - key: environment
          operator: In
          values: [staging]
        maxUpdate: 100%
      - matchExpressions:
        - key: environment
          operator: In
          values: [production]
        maxUpdate: 10%

  template:
    metadata:
      name: 'shield-{{name}}-{{nodegroup}}'
      namespace: argocd
      labels:
        app: sysdig-shield
        nodegroup: '{{nodegroup}}'
        cluster: '{{name}}'
        environment: '{{metadata.labels.environment}}'
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: sysdig-deployments
        notifications.argoproj.io/subscribe.on-sync-failed.slack: sysdig-alerts
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      sources:
      - repoURL: https://github.com/EdwardArchive/sysdig-shield-argocd.git
        targetRevision: KR-multi
        ref: values
      - repoURL: https://charts.sysdig.com
        chart: shield
        targetRevision: "1.28.0"
        helm:
          valueFiles:
          - $values/helm-values/base-values.yaml
          - $values/helm-values/resource-profiles/{{profile}}.yaml
          # 클러스터별 values가 있으면 사용, 없으면 base만 적용
          # 아래 경로에 해당 클러스터 폴더가 있어야 함
          - $values/helm-values/clusters/{{name}}/values.yaml
          - $values/helm-values/clusters/{{name}}/values-{{nodegroup}}.yaml

      destination:
        server: '{{server}}'
        namespace: 'sysdig-shield-{{nodegroup}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jsonPointers:
        - /webhooks/0/clientConfig/caBundle
